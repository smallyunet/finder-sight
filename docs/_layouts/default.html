<!doctype html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b1220">
    <meta name="color-scheme" content="light">
    {% seo %}
    <link rel="icon" href="{{ '/assets/app-icon.webp' | relative_url }}" type="image/webp">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body class="{{ page.page_class | default: 'content-page' }}">
    <a class="skip-link" href="#main-content">Skip to content</a>

    <header class="site-header">
      <div class="site-header-inner">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="Finder Sight home">
          <img src="{{ '/assets/app-icon.webp' | relative_url }}" width="36" height="36" alt="">
          <span>Finder Sight</span>
        </a>
        <nav class="site-nav" aria-label="Primary navigation">
          <a {% if page.nav == 'home' %}aria-current="page"{% endif %} href="{{ '/' | relative_url }}">Overview</a>
          <a {% if page.nav == 'guide' %}aria-current="page"{% endif %} href="{{ '/guide/' | relative_url }}">User Guide</a>
          <a href="{{ site.release_url }}">Releases</a>
          <a class="nav-github" href="{{ site.repository_url }}">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.69c-2.78.61-3.37-1.18-3.37-1.18-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.61.07-.61 1 .07 1.53 1.03 1.53 1.03.9 1.53 2.35 1.09 2.92.83.09-.65.35-1.09.64-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02A9.56 9.56 0 0 1 12 6.7c.85 0 1.71.11 2.51.34 1.91-1.29 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.86v2.76c0 .27.18.58.69.48A10 10 0 0 0 12 2Z" />
            </svg>
            GitHub
          </a>
        </nav>
      </div>
    </header>

    <main id="main-content" class="main-content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="site-footer-inner">
        <div>
          <a class="brand footer-brand" href="{{ '/' | relative_url }}">
            <img src="{{ '/assets/app-icon.webp' | relative_url }}" width="32" height="32" alt="">
            <span>Finder Sight</span>
          </a>
          <p>Private visual search for your Mac.</p>
        </div>
        <div class="footer-links">
          <a href="{{ '/guide/' | relative_url }}">User Guide</a>
          <a href="{{ site.release_url }}">Releases</a>
          <a href="https://github.com/smallyunet/finder-sight/blob/main/PRIVACY.md">Privacy</a>
          <a href="https://github.com/smallyunet/finder-sight/blob/main/SECURITY.md">Security</a>
          <a href="{{ site.repository_url }}">Source</a>
        </div>
        <p class="footer-meta">MIT Licensed · Built for macOS 13+</p>
      </div>
    </footer>
  </body>
</html>
