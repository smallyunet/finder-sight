name: Build macOS App

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions: read-all

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Resolve version
      id: version
      shell: bash
      run: |
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
        else
          echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
        fi

    - name: Validate release version
      if: startsWith(github.ref, 'refs/tags/v')
      shell: bash
      run: |
        test "${GITHUB_REF_NAME#v}" = "$(tr -d '[:space:]' < VERSION)"

    - name: Test Swift package
      run: swift test

    - name: Build native app
      run: bash scripts/build_app.sh "${{ steps.version.outputs.version }}"

    - name: Create DMG
      run: |
        bash scripts/create_dmg.sh

    - name: Generate SHA-256 checksum
      working-directory: dist
      run: shasum -a 256 FinderSight-macOS.dmg > FinderSight-macOS.dmg.sha256

    - name: Upload artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: FinderSight-macOS
        path: |
          dist/FinderSight-macOS.dmg
          dist/FinderSight-macOS.dmg.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
    - name: Download release artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: FinderSight-macOS
        path: dist

    - name: Generate build provenance
      uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.0.0
      with:
        subject-path: dist/FinderSight-macOS.dmg

    - name: Create GitHub Release
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
      with:
        files: |
          dist/FinderSight-macOS.dmg
          dist/FinderSight-macOS.dmg.sha256
        generate_release_notes: true

  virustotal:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VT_API_KEY: ${{ secrets.VT_API_KEY }}

    steps:
    - name: Submit release to VirusTotal
      if: env.VT_API_KEY != ''
      shell: bash
      run: |
        mkdir -p dist
        gh release download "${GITHUB_REF_NAME}" --pattern FinderSight-macOS.dmg --dir dist
        curl --fail --silent --show-error \
          --request POST \
          --url https://www.virustotal.com/api/v3/files \
          --header "x-apikey: ${VT_API_KEY}" \
          --form "file=@dist/FinderSight-macOS.dmg" \
          --output virustotal-response.json

        jq -e '.data.id | strings' virustotal-response.json > /dev/null
        file_sha256="$(sha256sum dist/FinderSight-macOS.dmg | cut -d ' ' -f 1)"
        report_url="https://www.virustotal.com/gui/file/${file_sha256}"
        gh release view "${GITHUB_REF_NAME}" --json body --jq .body > release-notes.md
        printf '\n\n## Security scan\n\n[VirusTotal report](%s)\n' "${report_url}" >> release-notes.md
        gh release edit "${GITHUB_REF_NAME}" --notes-file release-notes.md
